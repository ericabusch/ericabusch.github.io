  HOW TO USE:
  1. Copy this file into the updates/ folder.
  2. Rename it to "update-{slug}.html" where {slug} is a long random
     hex string, e.g.:
       updates/update-q7z2k9x4.html
     Generate a slug with:
       python3 -c "import secrets; print(secrets.token_hex(4))"
     (Do NOT use guessable names like "private.html" or "family.html" —
     the filename itself is the only thing keeping this page obscure.)
  3. Edit the title and content below.
  4. Do NOT link to it from index.html, pages/*.html, or any nav menu.
     Share the direct URL only with the people you want to see it, e.g.:
       https://ericabusch.github.io/updates/update-q7z2k9x4.html
  5. Commit and push as usual.

  IMPORTANT CAVEATS (read before relying on this):
  - This is obscurity, not real access control. There is no password.
    Anyone who has the link (or guesses it, or finds it in git history,
    or browses the public GitHub repo file tree) can view it.
  - Because this repo is public, every file — including this one and
    every private update page — is visible in the repo's commit history
    on GitHub forever, even if you later delete or rename the page.
    Never put anything here you wouldn't want permanently public if the
    link leaked.
  - The noindex meta tag + robots.txt entry below stop well-behaved
    search engines from crawling/indexing these pages, but they do not
    stop a person with the link from viewing or resharing it.
  - If you need real privacy (password protection, real access control),
    GitHub Pages alone can't do it — you'd need a different host
    (e.g. Netlify/Cloudflare Pages with access rules) or a private repo
    on a paid GitHub plan.
-->
